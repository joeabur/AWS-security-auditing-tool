name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs (checkout v7.0.1, setup-uv v10.3.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy
      - name: Unit tests (no AWS credentials, no network to AWS)
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: uv run pytest tests/unit --cov=awsauditor --cov-report=term-missing --cov-fail-under=95
      - name: Build wheel and smoke-test the installed package
        run: |
          uv build --wheel -o "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          smoke/bin/awsauditor controls list | grep -q "(40 controls)"
          smoke/bin/awsauditor policy generate --audit-profile full > /dev/null
      - name: Dependency audit (pip-audit)
        run: |
          uv export --locked --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: Secret scan (detect-secrets)
        run: git ls-files -z . | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
